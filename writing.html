<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2a9b7"><title>Weekly Writing — 8 Weeks of English</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/cover.jpg" alt=""><span>8 WEEKS OF ENGLISH</span></a><nav class="nav"><a href="reader.html">Workbook</a><a href="roadmap.html">Roadmap</a></nav></div></header>
<main class="shell page"><div class="eyebrow">WEEKLY WRITING · 書く</div><h1>One piece of writing</h1><p class="subhead">Choose a week. Drafts save automatically in this browser on this device.</p><div class="actions no-print" id="weekButtons"></div><section id="task"></section></main>
<script src="data.js"></script><script>
const buttons=document.getElementById('weekButtons'),task=document.getElementById('task');let week=Math.min(8,Math.max(1,Number(new URLSearchParams(location.search).get('week'))||1));
WORKBOOK.weeks.forEach(w=>buttons.insertAdjacentHTML('beforeend',`<button class="btn ${w.week===week?'pink':'secondary'}" data-week="${w.week}">W${w.week}</button>`));
function render(){const w=WORKBOOK.weeks[week-1],d=WORKBOOK.writing[week],key=`writing-week-${week}`,saved=localStorage.getItem(key)||'';task.innerHTML=`<article class="task-card"><div class="eyebrow">WEEK ${String(week).padStart(2,'0')} · ${w.phase}</div><h2>${w.writing}</h2><p><strong>${w.words} words</strong></p><div class="phrase-row">${d.phrases.map(x=>`<span class="phrase">${x}</span>`).join('')}</div><p>${d.prompt}</p><div class="checklist"><label><input type="checkbox"> verb tense</label><label><input type="checkbox"> articles</label><label><input type="checkbox"> prepositions</label><label><input type="checkbox"> sentence linking</label><label><input type="checkbox"> repeated vocabulary</label><label><input type="checkbox"> unnatural translation</label></div><h3>Your draft</h3><textarea class="writing-area" id="draft" placeholder="Write here…"></textarea><div class="counter" id="count"></div><p class="notice">Saved locally on this device. It is not uploaded anywhere by this web app.</p><h3>AI correction prompt</h3><div class="copybox" id="ai">${WORKBOOK.aiPrompt}</div><div class="actions no-print" style="margin-top:12px"><button class="btn secondary" id="copy">Copy correction prompt</button><a class="btn secondary" href="reader.html?page=${w.writingPage}">Open original PDF page</a></div></article>`;const ta=document.getElementById('draft');ta.value=saved;const c=document.getElementById('count');const update=()=>{localStorage.setItem(key,ta.value);const n=(ta.value.trim().match(/\b[\w’'-]+\b/g)||[]).length;c.textContent=`${n} words · target ${w.words}`};ta.oninput=update;update();document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(WORKBOOK.aiPrompt);document.getElementById('copy').textContent='Copied ✓'};history.replaceState(null,'',`?week=${week}`)}
buttons.addEventListener('click',e=>{const b=e.target.closest('[data-week]');if(!b)return;week=Number(b.dataset.week);buttons.querySelectorAll('button').forEach(x=>x.className=`btn ${Number(x.dataset.week)===week?'pink':'secondary'}`);render()});render();
</script><script src="app.js"></script></body></html>
