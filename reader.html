<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2a9b7"><title>Workbook Reader — 8 Weeks of English</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/cover.jpg" alt=""><span>8 WEEKS OF ENGLISH</span></a><nav class="nav"><a href="index.html">Home</a><a href="words.html">Words</a><a href="writing.html">Writing</a><a href="roadmap.html">Roadmap</a></nav></div></header>
<main class="reader-shell"><div class="reader-tools"><strong>FULL WORKBOOK</strong><span>Page</span><input id="page" type="number" min="1" max="123" value="1"><button class="btn pink" id="go">Go</button><a class="btn secondary" id="external" target="_blank">Open PDF</a><span class="status" data-status></span></div><iframe class="reader-frame" id="pdf" title="Full workbook PDF"></iframe><p class="notice">If your browser does not show the embedded PDF, use <strong>Open PDF</strong>. On a phone you can then share/open the file in PocketBook Reader.</p></main>
<script src="data.js"></script><script>const qs=new URLSearchParams(location.search);let p=Math.min(WORKBOOK.pages,Math.max(1,Number(qs.get('page'))||Number(localStorage.getItem('workbookPage'))||1));const input=document.getElementById('page'),frame=document.getElementById('pdf'),external=document.getElementById('external');function load(){input.value=p;localStorage.setItem('workbookPage',p);frame.src=`${WORKBOOK.pdf}#page=${p}&zoom=page-width`;external.href=`${WORKBOOK.pdf}#page=${p}`;history.replaceState(null,'',`?page=${p}`)};document.getElementById('go').onclick=()=>{p=Math.min(WORKBOOK.pages,Math.max(1,Number(input.value)||1));load()};input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});load();</script><script src="app.js"></script></body></html>
