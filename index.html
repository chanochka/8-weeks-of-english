<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#26323D">
<title>8 Weeks of English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="book.css">
<!--
  The home page (2026-10-02, her request): Today on top — Continue (the first day without ✓) and the cards waiting —
  then her progress (the 56 days, days in a row, words known / learning from the cards, ChatGPT Voice talks),
  the 8 weeks as tiles with each week's days, and the book itself (cover, PDF, plan, certificate) at the bottom.
  Everything is read from this browser: the book pages' "book-pN" and the cards' "cards" (deck.js).
  A day counts for the days in a row when its Core was finished that day, cards were answered or a short day was done.
  ◐ on the strip and the week tiles: a short day was done on that day, its Core not yet.
-->
<style>
.today .wk-of { font: 900 12px/1.3 "Nunito"; letter-spacing: .12em; text-transform: uppercase; color: var(--starry); }
.today .big { font: 700 27px/1.1 "Fredoka"; margin: 4px 0 6px; }
.today .goalt { color: var(--starry); font-weight: 800; }
.btn.go { font-size: 20px; padding: 11px 28px 10px; margin-top: 16px; box-shadow: 4px 4px 0 var(--pink); }
.crow { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 2px dotted var(--dots); }
.crow .ct { margin-right: auto; font: 600 19px/1.2 "Fredoka"; }
.crow .n { background: var(--hl); border-radius: 99px; padding: 0 9px; }
.crow .ok { color: var(--starry); }

.ofdays { font: 600 18px/1.2 "Fredoka"; }
.ofdays .n { font-size: 26px; }
.strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 10px 0 4px; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1.5px; height: 18px; border: var(--line); border-radius: 99px;
      overflow: hidden; background: var(--sky); }
.wk i { background: #fff; }
.wk i.on { background: var(--navy); }
.wk i.next { background: var(--pink); }
.wk i.half { background: linear-gradient(90deg, var(--navy) 50%, #fff 50%); }
.wk i.half.next { background: linear-gradient(90deg, var(--navy) 50%, var(--pink) 50%); }
.today .shortlink { display: block; margin-top: 12px; font-weight: 800; color: var(--starry); text-decoration: none; }
.wnums { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; text-align: center; font: 600 12px/1 "Fredoka"; color: var(--slate); }
.pfacts { margin-top: 16px; }
.pfacts .fact strong { font: 700 26px/1.05 "Fredoka"; margin-top: 4px; }
.pfacts .fact small { display: block; font: 800 13px/1.3 "Nunito"; color: var(--slate); }

.sect { font: 700 26px/1.1 "Fredoka"; margin: 6px 0 -8px; }
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.wt { position: relative; display: block; background: #fff; border: var(--line); border-radius: 16px; padding: 12px 12px 10px;
      box-shadow: 4px 4px 0 var(--blue); text-decoration: none; color: var(--navy); }
.wt.now { box-shadow: 4px 4px 0 var(--pink); }
.wt.off { background: transparent; box-shadow: none; border-style: dashed; }
.wt .wn { font: 900 11px/1.2 "Nunito"; letter-spacing: .12em; text-transform: uppercase; color: var(--starry); }
.wt .wtt { font: 600 18px/1.12 "Fredoka"; margin: 4px 0 10px; min-height: 2.24em; }
.wt .dots { display: flex; gap: 3px; }
.wt .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--navy); background: #fff; }
.wt .dots i.on { background: var(--navy); }
.wt .dots i.half { background: linear-gradient(90deg, var(--navy) 50%, #fff 50%); }
.wt.off .dots i { border-color: var(--dots); background: none; }
.wt .wf { font: 800 13px/1.3 "Nunito"; color: var(--slate); margin-top: 6px; }
.wt .here { position: absolute; top: -12px; right: 10px; background: var(--pink); border: var(--line); border-radius: 99px;
            font: 600 13px/1 "Fredoka"; padding: 4px 9px 3px; }

.bookc { display: grid; grid-template-columns: 130px 1fr; gap: 18px; align-items: start; }
.bookc img { width: 100%; border: var(--line); border-radius: 10px; }
.links a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 10px; padding: 8px 0; border-bottom: 2px dotted var(--dots);
           text-decoration: none; color: var(--navy); font-weight: 900; }
.links a:last-child { border-bottom: 0; }
.links small { grid-column: 1; font: 700 13px/1.3 "Nunito"; color: var(--slate); }
.links .ar { grid-row: 1 / 3; grid-column: 2; font: 700 20px/1 "Fredoka"; color: var(--slate); }
.bookc .inst { margin-top: 14px; }
.bookc .inst[hidden] { display: none; }

@media (max-width: 600px) {
  .today .big { font-size: 24px; }
  .btn.go { display: block; text-align: center; }
  .strip, .wnums { gap: 3px; }
  .wk { height: 16px; }
  .weeks { grid-template-columns: 1fr 1fr; gap: 14px; }
  .bookc { grid-template-columns: 92px 1fr; gap: 14px; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="index.html">8 WEEKS OF ENGLISH</a>
  <nav><a href="cards.html">Cards</a><a href="game.html">Game</a><a href="words.html">Words</a><a class="wide" href="writing.html">Writing</a></nav>
</div></header>
<main class="wrap" id="page"></main>
<script src="data.js"></script>
<script src="words-data.js"></script>
<script src="words-ru.js"></script>
<script src="my-words.js"></script>
<script src="deck.js"></script>
<script src="book-data.js"></script>
<script src="days.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const load = pageState, WEEKS = WORKBOOK.weeks;

// ---------- the days of the weeks that are online (days.js), numbered 1–56 ----------
const pages = Object.keys(BOOK).filter(k => /^\d+$/.test(k)).map(Number);
const days = bookDays();
const doneNums = new Set(days.filter(d => d.done).map(d => d.num));
const halfNums = new Set(days.filter(d => d.half).map(d => d.num));   // ◐ a short day, the Core not yet (short.html)
const next = days.find(d => !d.done);

// ---------- the cards (deck.js) ----------
const S = loadCards(), groups = deckGroups(S);
const waiting = deckQueue(S, groups).length, words = deckStats(S, groups);

// ---------- ChatGPT Voice talks: the ticked "ChatGPT Voice" items of the days ----------
let talks = 0;
for (const n of pages) {
  const t = load(n).ticks || {};
  BOOK[n].blocks.forEach(b => {
    if (b.type === 'checklist' && Array.isArray(b.items))
      b.items.forEach((x, i) => { if (/^<b>ChatGPT Voice/.test(x) && t[`${b.id}-${i}`]) talks++; });
  });
}

// ---------- days in a row: a day counts when its cards were answered or a day's Core was finished ----------
const studied = new Set(Object.keys(S.days).filter(k => S.days[k] > 0));
if (S.day.reviewed) studied.add(today);
days.forEach(d => d.doneOn && studied.add(d.doneOn));
days.forEach(d => d.shortOn.forEach(x => studied.add(x)));   // a short day keeps the days in a row (her «1 а»)
let streak = 0;
for (let i = studied.has(today) ? 0 : 1; studied.has(plus(-i)); i++) streak++;

// ---------- the page ----------
const tagH = (t, tc, navy) => `<span class="tag${navy ? ' navy' : ''}"${tc ? ` style="--tc:${tc}"` : ''}>${t}</span>`;
const lastOnline = WEEKS.filter(w => w.bookPage).pop();
const nextWeek = WEEKS.find(w => !w.bookPage);
const todayCard =
  `<div class="catwrap"><img class="cat" src="source/redesign/sprites/cat-peek.png" alt="">` +
  `<section class="card today" style="--sh:var(--navy)">${tagH('Today', '', true)}` +
  (next
    ? `<div class="wk-of">Week ${next.week.week} · ${esc(next.week.theme)}</div><div class="big">${esc(BOOK[next.page].nav)}</div>` +
      (next.goal ? `<p class="goalt">${esc(next.goal)}</p>` : '') +
      `<a class="btn go" href="book.html?page=${next.page}">Continue →</a>` +
      `<a class="shortlink" href="short.html?day=${next.page}">${next.shortOn.includes(today) ? '◐ short day done today · again ›' : 'No time today? Short day · 10 min ›'}</a>`
    : `<div class="big">Every online day is done ✓</div>` +
      `<p class="goalt">${nextWeek ? `Week ${nextWeek.week} comes online next.` : 'All 56 days — well done.'}</p>` +
      `<a class="btn go" href="book.html?page=${lastOnline.bookPage}">Week ${lastOnline.week} →</a>`) +
  `<div class="crow"><span class="ct">Cards: ${waiting ? `<span class="n">${waiting}</span> waiting` : '<span class="ok">done for today ✓</span>'}</span>` +
  `<a class="btn light" href="cards.html">${waiting ? 'Start' : 'Open'}</a></div>` +
  `<div class="crow"><span class="ct">Word game <span class="ok">· 3–5 min</span></span><a class="btn light" href="game.html">Play</a></div></section></div>`;

const strip = WEEKS.map(w => `<div class="wk">${Array.from({length: 7}, (_, i) => {
  const n = (w.week - 1) * 7 + i + 1;
  return `<i class="${doneNums.has(n) ? 'on' : [halfNums.has(n) && 'half', next && next.num === n && 'next'].filter(Boolean).join(' ')}"></i>`;
}).join('')}</div>`).join('');
const progress =
  `<section class="card" style="--sh:var(--blue)">${tagH('My progress', 'var(--blue)')}` +
  `<div class="ofdays"><span class="n">${doneNums.size}</span> of 56 days</div>` +
  `<div class="strip">${strip}</div><div class="wnums">${WEEKS.map(w => `<span>${w.week}</span>`).join('')}</div>` +
  `<div class="facts pfacts">` +
  `<div class="fact"><span class="label">Days in a row</span><strong>${streak}</strong><small>${studied.has(today) ? 'today counts ✓' : streak ? 'do today’s cards to keep it' : 'cards, a short day or a Core'}</small></div>` +
  `<div class="fact"><span class="label">ChatGPT talks</span><strong>${talks}</strong><small>${talks * 10} min out loud</small></div>` +
  `<div class="fact"><span class="label">Words known</span><strong>${words.known}</strong><small>two weeks and more</small></div>` +
  `<div class="fact"><span class="label">Learning</span><strong>${words.learning}</strong><small>of ${words.all} in the cards</small></div>` +
  `</div></section>`;

const tiles = WEEKS.map(w => {
  const online = !!w.bookPage, n = Array.from({length: 7}, (_, i) => (w.week - 1) * 7 + i + 1).filter(x => doneNums.has(x)).length;
  const here = next && next.week.week === w.week;
  return `<a class="wt${here ? ' now' : ''}${online ? '' : ' off'}" href="${online ? `book.html?page=${w.bookPage}` : `reader.html?page=${w.openerPage}`}">` +
    (here ? `<span class="here">now</span>` : '') +
    `<div class="wn">Week ${String(w.week).padStart(2, '0')}</div><div class="wtt">${esc(w.theme)}</div>` +
    `<div class="dots">${Array.from({length: 7}, (_, i) => (x => `<i class="${doneNums.has(x) ? 'on' : halfNums.has(x) ? 'half' : ''}"></i>`)((w.week - 1) * 7 + i + 1)).join('')}</div>` +
    `<div class="wf">${online ? `${n} / 7 days${n === 7 ? ' ✓' : ''}` : 'online soon · PDF'}</div></a>`;
}).join('');

const link = (href, t, small, blank) => `<a href="${href}"${blank ? ' target="_blank"' : ''}><span>${t}</span><small>${small}</small><span class="ar">›</span></a>`;
const bookCard =
  `<section class="card" style="--sh:var(--lav)">${tagH('The book', 'var(--lav)')}<div class="bookc">` +
  `<img src="assets/cover.jpg" alt="8 Weeks of English — the cover">` +
  `<div><div class="links">` +
  link('8-weeks-of-english-full.pdf', 'Full book · PDF', 'all 123 pages, for any PDF app', true) +
  link('roadmap.html', 'The 8-week plan', 'phase, theme and targets of every week') +
  link('certificate.html', 'Certificate', 'after day 56') +
  link('words.html', 'Word bank', 'every week’s phrases, with audio') +
  link('writing.html', 'Writing', 'type the weekly writing here') +
  link('reader.html', 'The PDF on the site', 'any page of the original book') +
  link('move.html', 'Move my progress', 'to another phone, browser or the app') +
  `</div><button type="button" class="btn light inst" data-install hidden>Install the app</button></div></div></section>`;

document.getElementById('page').innerHTML =
  `<div class="head"><div class="badge"><span class="d">DAY</span><span class="n">${next ? next.num : '✓'}</span></div>` +
  `<div><div class="kicker">8 Weeks of English · B1 → B2</div><div class="title">Today</div>` +
  `<div class="sub">${new Date().toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'})}</div></div>` +
  `<div class="jp"><span class="k">今日</span><span class="k2">毎日少しずつ</span></div>` +
  `<img class="star" src="source/redesign/sprites/star-yellow.png" alt=""></div>` +
  `<div class="stack">${todayCard}${progress}<h2 class="sect">8 weeks</h2><div class="weeks">${tiles}</div>${bookCard}</div>` +
  `<p class="motto">Use English. Don’t just study English.</p>`;
</script>
<script src="app.js"></script>
</body>
</html>
