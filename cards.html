<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#26323D">
<title>Today’s cards — 8 Weeks of English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="book.css">
<!--
  Daily cards (2026-10-02, her goal: words and speaking, no grammar). Every word of the weeks that are online
  (words-data.js + words-ru.js), «Мой мир» (my-words.js) and her own phrases. A card starts from the meaning in
  Russian; she says the English out loud, then opens it. "Got it" sends it further away (1, 3, 7, 14, 30, 60 days),
  "Not yet" brings it back later today and tomorrow. Everything lives in this browser only (localStorage "cards").
  2026-10-05, her five wishes: when today's cards are finished, "Today's cards" in the day's Core ticks itself (the day
  the cards were opened from, ?day=N, or else the day Continue opens; days.js); "Once more" goes through today's cards
  or all the cards she has seen again without moving them in the boxes; the Voice card picks the voice (voice.js).
-->
<style>
.face { text-align: center; padding: 6px 0 2px; }
.face .src { font: 900 12px/1.3 "Nunito"; letter-spacing: .12em; text-transform: uppercase; color: var(--starry); }
.face .ru { font: 800 25px/1.25 "Nunito"; margin: 10px 0 6px; }
.face .exru { font: 700 16px/1.4 "Nunito"; color: var(--starry); font-style: italic; }
.face .say { font: 800 14px/1.3 "Nunito"; color: var(--starry); margin-top: 14px; }
.face .first { font: 700 22px/1 "Fredoka"; letter-spacing: .08em; margin-top: 10px; min-height: 22px; }
.back { border-top: 2px dotted var(--dots); margin-top: 16px; padding-top: 14px; }
.back .en { font: 700 30px/1.1 "Fredoka"; display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.back .exen { font: 700 17px/1.45 "Nunito"; margin-top: 8px; display: flex; gap: 10px; align-items: center; justify-content: center; text-align: center; }
.fbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.fbtns .btn { font-size: 17px; padding: 10px 22px 9px; cursor: pointer; }
.btn.no { background: #fff; color: var(--navy); box-shadow: 3px 3px 0 var(--pink); }
.prog { height: 10px; border: var(--line); border-radius: 99px; overflow: hidden; background: #fff; margin: 4px 0 14px; }
.prog i { display: block; height: 100%; background: var(--yellow); }
.alldone { text-align: center; }
.alldone .big { font: 700 28px/1.1 "Fredoka"; margin: 4px 0 8px; }
.groups label { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 2px dotted var(--dots); }
.groups .cnt { margin-left: auto; color: var(--starry); font-size: 14px; white-space: nowrap; }
.groups input { flex: none; margin: 0; }
.groups .tick input:checked + span { color: var(--navy); }
.stats { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; }
.stats b { color: var(--navy); }
.newper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.newper span { flex-basis: 100%; }
.newper button { border: var(--line); border-radius: 99px; background: #fff; padding: 4px 12px; font: 800 15px "Nunito"; cursor: pointer; }
.newper button.on { background: var(--navy); color: #fff; }
.addf { display: grid; gap: 8px; }
.addf input { width: 100%; border: var(--line); border-radius: 12px; background: #FFF8E5; padding: 7px 12px; font-weight: 800; }
.own { margin-top: 10px; }
.own div { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 2px dotted var(--dots); font-size: 15px; }
.own button { margin-left: auto; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--starry); }
details.list { margin-top: 6px; }
details.list summary { cursor: pointer; font-weight: 900; padding: 6px 0; }
.lrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 2px dotted var(--dots); font-size: 15px; }
.lrow .lv { font-size: 12px; letter-spacing: 2px; color: var(--starry); white-space: nowrap; }
.ticked { display: inline-block; background: var(--hl); border-radius: 99px; padding: 3px 12px; font-weight: 900; margin: 2px 0 4px; }
.ticked a { color: var(--navy); }
.once { margin-top: 16px; padding-top: 14px; border-top: 2px dotted var(--dots); }
.once .fbtns { margin-top: 8px; }
.stop { display: block; margin: 14px auto 0; border: 0; background: none; font: 800 14px "Nunito"; color: var(--starry); text-decoration: underline; cursor: pointer; }
.vnow { display: flex; gap: 12px; align-items: center; font-size: 16px; margin-top: 4px; }
.vnow > span { flex: 1; }
.vnow b, .vtip b, .voices .vrow b { color: var(--navy); }
.vnow .play { flex: none; }
.vnow small, .vrow small { color: var(--starry); font-weight: 800; }
.voices { margin-top: 8px; }
.voices summary { cursor: pointer; font-weight: 900; padding: 6px 0; }
.voices .vrow { display: flex; width: 100%; gap: 10px; align-items: center; padding: 7px 4px; border: 0; border-bottom: 2px dotted var(--dots);
                background: none; font: 800 15px "Nunito"; color: var(--navy); text-align: left; cursor: pointer; }
.voices .vrow.on { background: var(--hl); border-radius: 10px; }
.voices .vrow .vp { margin-left: auto; color: var(--starry); }
.vtip { font-size: 14px; color: var(--slate); margin-top: 12px; }
@media (max-width: 600px) {
  .face .ru { font-size: 22px; }
  .back .en { font-size: 26px; }
  .lrow { grid-template-columns: 1fr auto; }
  .lrow .lru { grid-column: 1 / -1; order: 3; color: var(--starry); margin-top: -4px; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="index.html">8 WEEKS OF ENGLISH</a>
  <nav><a href="book.html?page=6">Week 1</a><a href="cards.html">Cards</a><a href="game.html">Game</a><a class="wide" href="words.html">Words</a><a class="wide" href="writing.html">Writing</a></nav>
</div></header>
<main class="wrap" id="page"></main>
<script src="words-data.js"></script>
<script src="words-ru.js"></script>
<script src="my-words.js"></script>
<script src="deck.js"></script>
<script src="data.js"></script>
<script src="book-data.js"></script>
<script src="days.js"></script>
<script src="voice.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// ---------- the deck and what she did (deck.js); the page works without saved data ----------
const S = loadCards();
S.day.seen = S.day.seen || [];   // ids of the cards answered today, for "Once more"
function save() { try { localStorage.setItem('cards', JSON.stringify(S)); } catch (e) {} }
let groups = deckGroups(S);
const on = g => !S.off.includes(g.id);
const buildQueue = () => deckQueue(S, groups);
let queue = buildQueue(), pos = 0, shown = false, hint = false, again = new Set();
// "Once more": cards she has seen, gone through again; nothing moves in the boxes
let once = null;   // {cards, pos, again: Set}

// ---------- the day whose Core gets "Today's cards" ticked: the one the cards were opened from, else Continue's ----------
const fromDay = (() => { const n = Number(new URLSearchParams(location.search).get('day')); return BOOK[n] && /^Day \d/.test(BOOK[n].nav) ? n : 0; })();
function tickDay() {
  if (!S.day.reviewed || pos < queue.length) return;
  // opened from the home page: only the first day of the day gets it (later, Continue may point at the next day)
  const page = fromDay || (!S.day.ticked && (currentDay() || {}).page);
  if (!page || S.day.ticked === page) return;
  if (tickTodaysCards(page)) { S.day.ticked = page; save(); }
}

// ---------- ▶ reads English out loud with the voice from the Voice card (voice.js) ----------
const SAMPLE = 'Hi! I usually get up around seven, and the first thing I do is make a coffee.';
const play = text => canSpeak ? `<button type="button" class="play" data-say="${esc(text)}" aria-label="Listen">▶</button>` : '';

// ---------- the page ----------
const tagH = (t, tc) => `<span class="tag"${tc ? ` style="--tc:${tc}"` : ''}>${t}</span>`;
const seenToday = () => { const all = groups.filter(on).flatMap(g => g.cards); return S.day.seen.map(id => all.find(c => c.id === id)).filter(Boolean); };
const seenAll = () => groups.filter(on).flatMap(g => g.cards).filter(c => S.state[c.id]);
function faceHTML(c, open, buttons) {
  return `<div class="face"><div class="src">${esc(c.src)}${c.isNew ? ' · new' : ''}</div>` +
    `<div class="ru">${esc(c.ru)}</div>${c.exRu ? `<div class="exru">${esc(c.exRu)}</div>` : ''}` +
    (open ? `<div class="back"><div class="en">${esc(c.en)} ${play(c.en)}</div>` +
            (c.ex ? `<div class="exen"><span>${esc(c.ex)}</span>${play(c.ex)}</div>` : '') + `</div>` + buttons
          : `<div class="say">Say it in English, out loud — then open it</div>` +
            `<div class="first">${hint ? esc(c.en.replace(/[A-Za-z]+/g, w => w[0] + '·'.repeat(w.length - 1))) : ''}</div>` +
            `<div class="fbtns">${hint ? '' : '<button class="btn light" data-hint>First letters</button>'}<button class="btn" data-show>Show</button></div>`) +
    `</div>`;
}
function onceHTML() {
  const c = once.cards[once.pos], left = once.cards.length - once.pos;
  return `<div class="prog"><i style="width:${Math.round(once.pos / once.cards.length * 100)}%;background:var(--blue)"></i></div>` +
    `<section class="card" style="--sh:var(--blue)">${tagH(`Once more · ${left} left`, 'var(--blue)')}` +
    faceHTML(c, shown, `<div class="fbtns"><button class="btn no" data-once="0">Again later</button><button class="btn" data-once="1">Next</button></div>`) +
    `<button type="button" class="stop" data-stop>Stop — nothing changes in your cards</button></section>`;
}
function cardHTML() {
  if (once) return onceHTML();
  if (pos >= queue.length) {
    const tomorrow = groups.filter(on).flatMap(g => g.cards).filter(c => S.state[c.id] && S.state[c.id].d <= plus(1)).length;
    const t = seenToday().length, a = seenAll().length, tk = S.day.ticked && BOOK[S.day.ticked];
    return `<div class="catwrap"><img class="cat" src="source/redesign/sprites/cat-peek.png" alt=""><section class="card alldone" style="--sh:var(--yellow)">${tagH('Today', 'var(--yellow)')}` +
      `<div class="big">${S.day.reviewed ? 'Done for today ✓' : 'Nothing due right now'}</div>` +
      (tk ? `<div class="ticked">✓ ticked in the Core of <a href="book.html?page=${S.day.ticked}">${esc(tk.nav.split(' · ')[0])}</a></div>` : '') +
      `<p>${S.day.reviewed ? `${S.day.reviewed} cards today.` : ''} Tomorrow: about ${tomorrow + S.newPerDay} cards.</p>` +
      `<div class="fbtns">${fromDay ? `<a class="btn" href="book.html?page=${fromDay}">Back to ${esc(BOOK[fromDay].nav.split(' · ')[0])} →</a>` : ''}` +
      `<button class="btn light" data-more>+ 5 new cards now</button><a class="btn light" href="game.html">Word game ▶</a></div>` +
      (a ? `<div class="once"><b>Once more</b> — go through the cards you have seen; nothing changes in your boxes<div class="fbtns">` +
           (t ? `<button class="btn light" data-again="today">Today’s · ${t}</button>` : '') +
           `<button class="btn light" data-again="all">All I’ve seen · ${a}</button></div></div>` : '') +
      `</section></div>`;
  }
  const c = queue[pos];
  const left = queue.length - pos;
  return `<div class="prog"><i style="width:${Math.round(pos / queue.length * 100)}%"></i></div>` +
    `<section class="card" style="--sh:var(--yellow)">${tagH(`${left} left today`, 'var(--yellow)')}` +
    faceHTML(c, shown, `<div class="fbtns"><button class="btn no" data-ans="0">Not yet</button><button class="btn" data-ans="1">Got it</button></div>`) +
    `</section>`;
}
function voiceHTML(open) {
  if (!canSpeak) return '';
  const vs = englishVoices(), cur = currentVoice(), rate = voicePref().rate || .95;
  const what = v => `${voiceAccent(v)}${QUALITY[voiceQuality(v)] ? ' · ' + QUALITY[voiceQuality(v)] : ''}`;
  return `<section class="card" id="voice" style="--sh:var(--lav)">${tagH('Voice', 'var(--lav)')}` +
    `<p class="hint">the voice that reads the English on every page — tap a name to hear it</p>` +
    (cur ? `<div class="vnow"><span>Now: <b>${esc(voiceName(cur))}</b> <small>${what(cur)}</small></span>${play(SAMPLE)}</div>` +
           `<details class="voices"${open ? ' open' : ''}><summary>Choose another voice · ${vs.length}</summary>` +
           vs.map(v => `<button type="button" class="vrow${v === cur ? ' on' : ''}" data-voice="${esc(v.voiceURI)}">` +
             `<span>${esc(voiceName(v))} <small>${what(v)}</small></span><span class="vp">▶</span></button>`).join('') + `</details>`
         : `<p>This browser has no English voice yet.</p>`) +
    `<div class="newper"><span>Speed</span>${RATES.map(([n, r]) => `<button data-rate="${r}" class="${rate === r ? 'on' : ''}">${n}</button>`).join('')}</div>` +
    `<p class="vtip">Нужен голос лучше? iPhone: <b>Настройки → Универсальный доступ → Устное содержимое → Голоса → Английский</b>, ` +
    `скачай голос «улучшенный» или Premium и открой учебник заново — он появится здесь. На компьютере живее всего голоса Natural в Edge.</p></section>`;
}
function deckHTML() {
  const {all, known, learning} = deckStats(S, groups);
  return `<section class="card" style="--sh:var(--blue)">${tagH('In my deck', 'var(--blue)')}<p class="hint">untick what you do not want to practise</p>` +
    `<div class="groups">${groups.map(g => `<label class="tick"><input type="checkbox" data-group="${g.id}"${on(g) ? ' checked' : ''}>` +
      `<span>${esc(g.name)}</span><span class="cnt">${g.cards.length}</span></label>`).join('')}</div>` +
    `<div class="stats"><span>known <b>${known}</b></span><span>learning <b>${learning}</b></span><span>not started <b>${all - known - learning}</b></span></div>` +
    `<div class="newper"><span>New cards a day</span>${[5, 10, 15, 20].map(n => `<button data-newper="${n}" class="${S.newPerDay === n ? 'on' : ''}">${n}</button>`).join('')}</div></section>`;
}
function ownHTML() {
  return `<section class="card" style="--sh:var(--lav)">${tagH('Add my own', 'var(--lav)')}` +
    `<p class="hint">a phrase you met this week — from your phrase log, a video, a conversation</p>` +
    `<form class="addf" data-add><input name="en" placeholder="English phrase" autocomplete="off" required>` +
    `<input name="ru" placeholder="what it means, in Russian" autocomplete="off" required>` +
    `<input name="ex" placeholder="my own sentence with it (optional)" autocomplete="off">` +
    `<div><button class="btn" type="submit">Add to my cards</button></div></form>` +
    (S.own.length ? `<div class="own">${S.own.map(o => `<div><span><b>${esc(o.en)}</b> — ${esc(o.ru)}</span><button type="button" data-del="${o.id}" aria-label="Delete">×</button></div>`).join('')}</div>` : '') +
    `</section>`;
}
function listHTML() {
  const lv = c => { const s = S.state[c.id]; return s ? '●'.repeat(Math.min(s.b, 6)) + '○'.repeat(6 - Math.min(s.b, 6)) : 'new'; };
  return `<section class="card" style="--sh:var(--pink)">${tagH('All my cards')}<p class="hint">● how far each one has got</p>` +
    groups.filter(g => g.cards.length).map(g => `<details class="list"><summary>${esc(g.name)} · ${g.cards.length}</summary>` +
      g.cards.map(c => `<div class="lrow"><span><b>${esc(c.en)}</b></span><span class="lru">${esc(c.ru)}</span><span class="lv">${lv(c)}</span></div>`).join('') +
      `</details>`).join('') + `</section>`;
}
function render() {
  const left = Math.max(0, queue.length - pos);
  document.getElementById('page').innerHTML =
    `<div class="head"><div class="badge"><span class="d">TODAY</span><span class="n">${left}</span></div>` +
    `<div><div class="kicker">Every day · 10 minutes</div><div class="title">Today’s cards</div><div class="sub">the meaning first — the English comes out of your mouth</div></div>` +
    `<div class="jp"><span class="k">単語</span><span class="k2">毎日</span></div>` +
    `<img class="star" src="source/redesign/sprites/star-yellow.png" alt=""></div>` +
    `<div class="stack">${cardHTML()}${deckHTML()}${voiceHTML()}${ownHTML()}${listHTML()}</div>` +
    `<p class="motto">Use English. Don’t just study English.</p>`;
}
function redrawVoice() { const v = document.getElementById('voice'); if (v) v.outerHTML = voiceHTML(v.querySelector('details') && v.querySelector('details').open); }
voiceListeners.push(redrawVoice);

// ---------- make it live ----------
function answer(ok) {
  const c = queue[pos], s = S.state[c.id] || {b: 0};
  if (c.isNew && !S.state[c.id]) S.day.newSeen++;
  if (ok) { s.b = again.has(c.id) ? 1 : Math.min((s.b || 0) + 1, 6); s.d = plus(DAYS[s.b]); }
  else { s.b = 0; s.d = plus(1); if (!again.has(c.id)) { again.add(c.id); queue.push({...c, isNew: false}); } }
  S.state[c.id] = s; S.day.reviewed++; S.days[today] = (S.days[today] || 0) + 1;
  if (!S.day.seen.includes(c.id)) S.day.seen.push(c.id);
  pos++; shown = false; hint = false; save(); tickDay(); render();
}
// "Once more": "Again later" sends the card to the end once, "Next" goes on; the boxes are not touched
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startOnce(what) {
  // all she has seen: the weakest boxes first, shuffled inside a box
  const cards = what === 'today' ? shuffle(seenToday()) : shuffle(seenAll()).sort((a, b) => S.state[a.id].b - S.state[b.id].b);
  once = {cards: cards.map(c => ({...c, isNew: false})), pos: 0, again: new Set()};
  shown = false; hint = false; render(); window.scrollTo(0, 0);
}
function onceNext(ok) {
  const c = once.cards[once.pos];
  if (!ok && !once.again.has(c.id)) { once.again.add(c.id); once.cards.push(c); }
  once.pos++; shown = false; hint = false;
  if (once.pos >= once.cards.length) once = null;
  render();
}
const current = () => once ? once.cards[once.pos] : queue[pos];
function show() { shown = true; render(); speak(current().en); }
document.addEventListener('click', e => {
  const t = e.target.closest('button, input');
  if (!t) return;
  if (t.dataset.say) return speak(t.dataset.say);
  if (t.hasAttribute('data-show')) return show();
  if (t.hasAttribute('data-hint')) { hint = true; return render(); }
  if (t.dataset.ans) return answer(t.dataset.ans === '1');
  if (t.dataset.once) return onceNext(t.dataset.once === '1');
  if (t.dataset.again) return startOnce(t.dataset.again);
  if (t.hasAttribute('data-stop')) { once = null; shown = false; hint = false; return render(); }
  if (t.dataset.voice) {
    const v = englishVoices().find(x => x.voiceURI === t.dataset.voice);
    if (v) { setVoicePref({uri: v.voiceURI, name: v.name}); redrawVoice(); speak(SAMPLE, v); }
    return;
  }
  if (t.dataset.rate) { setVoicePref({rate: Number(t.dataset.rate)}); redrawVoice(); return speak(SAMPLE); }
  if (t.hasAttribute('data-more')) { S.day.extra = (S.day.extra || 0) + 5; save(); queue = buildQueue(); pos = 0; again = new Set(); return render(); }
  if (t.dataset.newper) { S.newPerDay = Number(t.dataset.newper); save(); queue = buildQueue(); pos = 0; return render(); }
  if (t.dataset.del) { S.own = S.own.filter(o => String(o.id) !== t.dataset.del); save(); groups = deckGroups(S); queue = buildQueue(); pos = 0; return render(); }
});
document.addEventListener('change', e => {
  const g = e.target.dataset.group;
  if (!g) return;
  S.off = e.target.checked ? S.off.filter(x => x !== g) : S.off.concat(g);
  save(); queue = buildQueue(); pos = 0; render();
});
document.addEventListener('submit', e => {
  if (!e.target.hasAttribute('data-add')) return;
  e.preventDefault();
  const f = e.target, en = f.en.value.trim(), ru = f.ru.value.trim();
  if (!en || !ru) return;
  S.own.push({id: Date.now(), en, ru, ex: f.ex.value.trim()});
  save(); groups = deckGroups(S); queue = buildQueue(); pos = 0; render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, button, summary') || (!once && pos >= queue.length)) return;
  if (!shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); show(); }
  else if (shown && e.key === '1') once ? onceNext(false) : answer(false);
  else if (shown && e.key === '2') once ? onceNext(true) : answer(true);
});
tickDay();   // finished earlier today (from another page): tick the day she came from
render();
</script>
<script src="app.js"></script>
</body>
</html>
